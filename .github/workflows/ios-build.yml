name: ios-build

on:
  push:
    paths:
      - "ios/Brows/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/Brows
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios/Brows
        run: |
          xcodebuild \
            -project Brows.xcodeproj \
            -scheme Brows \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        working-directory: ios/Brows
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Brows.app Payload/
          zip -qry Brows.ipa Payload
          ls -la Brows.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Brows-ipa
          path: ios/Brows/Brows.ipa

      - name: Build for simulator
        working-directory: ios/Brows
        run: |
          xcodebuild \
            -project Brows.xcodeproj \
            -scheme Brows \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Launch in simulator and capture
        run: |
          set -e
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl list devices available --json | python3 -c "import json,re,sys;d=json.load(sys.stdin)['devices'];v=lambda k:tuple(map(int,re.search(r'iOS-(\d+)-(\d+)',k).groups())) if re.search(r'iOS-(\d+)-(\d+)',k) else (0,0);print(next(x['udid'] for k in sorted(d,key=v,reverse=True) for x in d[k] if 'iPhone' in x['name']))")
          echo "device: $DEVICE"
          xcrun simctl list devices | grep "$DEVICE" || true
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/Brows/build-sim/Build/Products/Debug-iphonesimulator/Brows.app
          xcrun simctl launch --terminate-running-process "$DEVICE" dev.brows.ios || echo "LAUNCH_RC=$?"
          sleep 3
          perl -e 'alarm shift; exec @ARGV' 20 xcrun simctl launch --console-pty --terminate-running-process "$DEVICE" dev.brows.ios > launch.txt 2>&1 || true
          sleep 3
          xcrun simctl io "$DEVICE" screenshot brows-launch.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep dev.brows.ios || echo "NOT RUNNING"
          xcrun simctl spawn "$DEVICE" log show --last 60s --style compact --predicate 'process == "Brows"' | tail -60 || true
          echo "---- launch console ----"
          cat launch.txt || true
          echo "---- crash reports ----"
          find ~/Library/Logs/DiagnosticReports -name "Brows*" -mmin -10 2>/dev/null | head -5 | while read -r f; do echo "### $f"; head -80 "$f"; done
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "Brows"' > brows-sim.log || true
          tail -60 brows-sim.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Brows-simulator
          path: |
            brows-launch.png
            brows-sim.log
            launch.txt
