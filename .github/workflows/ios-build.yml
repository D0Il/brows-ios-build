name: ios-build

on:
  push:
    paths:
      - "ios/Brows/**"
      - ".github/workflows/ios-build.yml"
      - ".github/ci/**"
  workflow_dispatch:
    inputs:
      only_test:
        description: "One test method (e.g. testAddressPillCompletesFromHistory); empty runs the suite"
        required: false
        default: ""
      skip_captures:
        description: "Skip the light/dark capture pass"
        type: boolean
        default: false

# The suite is 43 methods in one XCTestCase class, and Xcode's parallel testing
# distributes by class, so the shards below split it by method instead: one
# build-for-testing artifact, then four runners per destination running disjoint
# -only-testing subsets on iPhone and iPad. The plan lives in
# .github/ci/shards.json and is checked against the class before any shard starts.
# The separate BrowsAccessibilityUITests class has its own job because its
# simulator state (AX5, Reduce Motion) must be applied before the runner launches.
jobs:
  build-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/Brows
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios/Brows
        run: |
          xcodebuild \
            -project Brows.xcodeproj \
            -scheme Brows \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # The device build above is unsigned on purpose (no certificate on CI). Sign it ad-hoc with the
      # app's entitlements before zipping, so the ipa carries its keychain access group: an ipa
      # without one cannot save a password on a device (SecItemAdd -34018) and a sideloader has no
      # entitlements to preserve when it re-signs.
      - name: Sign the device app (ad-hoc, with entitlements)
        working-directory: ios/Brows
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/Brows.app
          codesign --force --sign - --timestamp=none             --entitlements Brows/Brows.entitlements "$APP"
          codesign -dv --entitlements :- "$APP" 2>&1 | tee signature.txt
          grep -q "keychain-access-groups" signature.txt
          test -d "$APP/_CodeSignature"

      - name: Package ipa
        working-directory: ios/Brows
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Brows.app Payload/
          zip -qry Brows.ipa Payload
          ls -la Brows.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Brows-ipa
          path: ios/Brows/Brows.ipa

  # Everything the tests need, on its own runner so the shards are not held
  # behind the device ipa build. Measured: both builds take ~0.7 min, so running
  # them side by side starts the shards about a minute earlier.
  build-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/Brows
        run: xcodegen generate

      # A dropped or duplicated method is the one failure mode sharding adds, and
      # it would look like a green run. Refuse to start a shard on a bad plan.
      - name: Verify the shard plan covers every test method
        run: python3 .github/ci/check-shards.py

      # The runner is macos-15-arm64 and so is every simulator it spawns. The
      # default generic simulator build is universal, which only makes the app and
      # the XCTest runner bundle bigger for xcodebuild to install on each shard.
      - name: Build for testing
        working-directory: ios/Brows
        run: |
          xcodebuild \
            -project Brows.xcodeproj \
            -scheme Brows \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build-test \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            build-for-testing

      - uses: actions/upload-artifact@v4
        with:
          name: Brows-testbuild
          path: ios/Brows/build-test/Build/Products
          retention-days: 3

  # Screenshots are not tests, but they need the same app the shards install.
  # Runs beside the shards instead of in front of them.
  captures:
    needs: build-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # Boot the device before the artifact download: the 80-220 s cold boot then
      # overlaps the download and the fixture server instead of following them.
      - name: Start the simulator booting
        run: |
          # simctl lists devices oldest runtime first and this image ships iOS 18.5
          # and 18.6 beside 26.x, so take the first iPhone in the newest iOS block.
          # The JSON form of this query costs 20-45 s on a cold runner.
          DEVICE=$(xcrun simctl list devices available | awk '/^-- /{ split($3,p,"."); cur=p[1]*100+p[2]; next } /iPhone/ && cur>best { if (match($0,/[0-9A-F-]{36}/)) { best=cur; u=substr($0,RSTART,RLENGTH) } } END{ print u }')
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: Brows-testbuild
          path: ios/Brows/build-test/Build/Products

      - name: Launch in simulator and capture
        run: |
          set -e
          xcrun simctl list runtimes
          xcrun simctl list devices | grep "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/Brows/build-test/Build/Products/Debug-iphonesimulator/Brows.app
          xcrun simctl launch "$DEVICE" dev.brows.ios | tee launch.txt || echo "LAUNCH_RC=$?"
          sleep 10
          xcrun simctl spawn "$DEVICE" launchctl list | grep dev.brows.ios | tee -a launch.txt || echo "NOT RUNNING"
          xcrun simctl io "$DEVICE" screenshot brows-launch.png
          xcrun simctl spawn "$DEVICE" log show --last 60s --style compact --predicate 'process == "Brows"' | tail -40 || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Serve fixtures
        run: bash .github/ci/fixtures.sh

      - name: Capture every sheet and appearance
        env:
          SKIP_CAPTURES: ${{ github.event.inputs.skip_captures }}
        run: bash .github/ci/capture.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Brows-simulator
          path: |
            brows-launch.png
            brows-article.png
            captures/*.png
            fixtures/server.log
            launch.txt

  ui-test:
    needs: build-tests
    if: ${{ !github.event.inputs.only_test }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        device: [iphone, ipad]
    name: UI tests ${{ matrix.device }} shard ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # Boot the device before the artifact download: the 80-220 s cold boot then
      # overlaps the download and the fixture server instead of following them.
      - name: Start the simulator booting
        run: |
          # The same 43 journeys run on both destinations, so each shard picks
          # the first device of its family in the newest iOS block. simctl lists
          # devices oldest runtime first. The JSON form costs 20-45 s cold.
          FAMILY="${{ matrix.device }}"
          DEVICE=$(xcrun simctl list devices available | awk -v fam="$FAMILY" '/^-- /{ split($3,p,"."); cur=p[1]*100+p[2]; next } tolower($0) ~ fam && cur>best { if (match($0,/[0-9A-F-]{36}/)) { best=cur; u=substr($0,RSTART,RLENGTH) } } END{ print u }')
          echo "device ($FAMILY): $DEVICE"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: Brows-testbuild
          path: ios/Brows/build-test/Build/Products

      - name: Serve fixtures
        run: bash .github/ci/fixtures.sh

      - name: Run shard ${{ matrix.shard }} on ${{ matrix.device }}
        working-directory: ios/Brows
        run: |
          set -euo pipefail
          XCTESTRUN=$(ls build-test/Build/Products/*.xctestrun | head -1)
          echo "xctestrun: $XCTESTRUN"
          ONLY=$(python3 -c "import json;d=json.load(open('$GITHUB_WORKSPACE/.github/ci/shards.json'));print(' '.join('-only-testing:BrowsUITests/BrowsUITests/'+t for t in d['${{ matrix.shard }}']))")
          echo "shard ${{ matrix.shard }} methods:"
          printf '%s\n' $ONLY
          echo "device: $DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          RC=0
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$DEVICE" \
            -resultBundlePath "shard-${{ matrix.shard }}-${{ matrix.device }}.xcresult" \
            $ONLY || RC=$?
          echo "---- crash reports ----"
          find ~/Library/Logs/DiagnosticReports -name "Brows*" -mmin -10 2>/dev/null | head -5 | while read -r f; do echo "### $f"; head -80 "$f"; done
          xcrun simctl spawn "$DEVICE" log show --last 3m --predicate 'process == "Brows"' > shard-sim-${{ matrix.device }}.log || true
          tail -60 shard-sim-${{ matrix.device }}.log
          exit $RC

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-shard-${{ matrix.shard }}-${{ matrix.device }}
          path: |
            fixtures/server.log
            ios/Brows/shard-sim-${{ matrix.device }}.log
            ios/Brows/shard-${{ matrix.shard }}-${{ matrix.device }}.xcresult
          if-no-files-found: ignore

  # Dynamic Type at AX5, Reduce Motion and the VoiceOver tree. The settings are
  # written into the simulator before xcodebuild launches the runner, and each
  # test asserts the setting it depends on, so default configuration cannot pass.
  accessibility:
    needs: build-tests
    if: ${{ !github.event.inputs.only_test }}
    runs-on: macos-15
    name: Accessibility (AX5, Reduce Motion, VoiceOver)
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Start the simulator booting
        run: |
          DEVICE=$(xcrun simctl list devices available | awk '/^-- /{ split($3,p,"."); cur=p[1]*100+p[2]; next } /iPhone/ && cur>best { if (match($0,/[0-9A-F-]{36}/)) { best=cur; u=substr($0,RSTART,RLENGTH) } } END{ print u }')
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: Brows-testbuild
          path: ios/Brows/build-test/Build/Products

      - name: Serve fixtures
        run: bash .github/ci/fixtures.sh

      - name: Set AX5 and Reduce Motion before the runner launches
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$DEVICE" -b
          # Reduce Motion has no live setter; the accessibility service reads the
          # preference at launch, so write it and reboot the device.
          xcrun simctl spawn "$DEVICE" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" content_size accessibility-extra-extra-extra-large
          echo "content size: $(xcrun simctl ui "$DEVICE" content_size)"
          echo "reduce motion: $(xcrun simctl spawn "$DEVICE" defaults read com.apple.Accessibility ReduceMotionEnabled)"

      - name: Run the accessibility pass
        working-directory: ios/Brows
        run: |
          set -euo pipefail
          XCTESTRUN=$(ls build-test/Build/Products/*.xctestrun | head -1)
          echo "xctestrun: $XCTESTRUN"
          echo "device: $DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$DEVICE" \
            -resultBundlePath accessibility.xcresult \
            -only-testing:BrowsUITests/BrowsAccessibilityUITests

      - name: Accessibility simulator log and crash reports
        if: always()
        working-directory: ios/Brows
        run: |
          find ~/Library/Logs/DiagnosticReports -name "Brows*" -mmin -10 2>/dev/null | head -5 | while read -r f; do echo "### $f"; head -80 "$f"; done
          xcrun simctl spawn "$DEVICE" log show --last 4m --predicate 'process == "Brows"' > accessibility-sim.log || true
          tail -60 accessibility-sim.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility
          path: |
            fixtures/server.log
            ios/Brows/accessibility-sim.log
            ios/Brows/accessibility.xcresult
          if-no-files-found: ignore

  # The focused-rerun path the suite already had: one method, no shards.
  ui-test-single:
    needs: build-tests
    if: ${{ github.event.inputs.only_test }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Start the simulator booting
        run: |
          # simctl lists devices oldest runtime first and this image ships iOS 18.5
          # and 18.6 beside 26.x, so take the first iPhone in the newest iOS block.
          # The JSON form of this query costs 20-45 s on a cold runner.
          DEVICE=$(xcrun simctl list devices available | awk '/^-- /{ split($3,p,"."); cur=p[1]*100+p[2]; next } /iPhone/ && cur>best { if (match($0,/[0-9A-F-]{36}/)) { best=cur; u=substr($0,RSTART,RLENGTH) } } END{ print u }')
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: Brows-testbuild
          path: ios/Brows/build-test/Build/Products

      - name: Serve fixtures
        run: bash .github/ci/fixtures.sh

      - name: Run one test
        working-directory: ios/Brows
        env:
          ONLY_TEST: ${{ github.event.inputs.only_test }}
        run: |
          set -euo pipefail
          XCTESTRUN=$(ls build-test/Build/Products/*.xctestrun | head -1)
          echo "xctestrun: $XCTESTRUN"
          echo "device: $DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          echo "only: $ONLY_TEST"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$DEVICE" \
            -only-testing:"BrowsUITests/BrowsUITests/$ONLY_TEST"
