name: ios-build

on:
  push:
    paths:
      - "ios/Brows/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/Brows
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios/Brows
        run: |
          xcodebuild \
            -project Brows.xcodeproj \
            -scheme Brows \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        working-directory: ios/Brows
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Brows.app Payload/
          zip -qry Brows.ipa Payload
          ls -la Brows.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Brows-ipa
          path: ios/Brows/Brows.ipa
